[pytest]
# DUZELTME (2026-09-01): testpaths bosken pytest tum repo agacini
# (norecursedirs'e girmeyen HER dizin dahil) test_*.py deseniyle tarayip
# eslesen HER dosyayi import ediyordu - sidecar/test_receiver.py (module
# seviyesinde serve_forever() cagiran bir betik) bu yuzden pytest
# collection'i sonsuza kadar bloke etti (CI ve yerel "pytest -q" bu yuzden
# askida kaldi). testpaths artik sadece gercek test dizinini isaret ediyor.
testpaths = tests
norecursedirs = archive .git build dist release node_modules .venv venv __pycache__ sidecar
